<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Maritime port abstract background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061629"/>
      <stop offset="0.55" stop-color="#0A2540"/>
      <stop offset="1" stop-color="#102E54"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="1" stop-color="#020A14"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A961" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C9A961" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.85" cy="0.18" r="0.18">
      <stop offset="0" stop-color="#C9A961" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C9A961" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#moon)"/>

  <!-- Distant horizon glow -->
  <rect x="0" y="500" width="1600" height="20" fill="url(#goldGlow)" opacity="0.75"/>

  <!-- Stars -->
  <g fill="#C9A961" opacity="0.55">
    <circle cx="120" cy="80" r="1"/>
    <circle cx="260" cy="140" r="0.8"/>
    <circle cx="430" cy="60" r="1.2"/>
    <circle cx="610" cy="120" r="0.9"/>
    <circle cx="780" cy="40" r="1"/>
    <circle cx="990" cy="160" r="0.8"/>
    <circle cx="1180" cy="90" r="1.1"/>
    <circle cx="1320" cy="50" r="0.9"/>
    <circle cx="1480" cy="180" r="1"/>
  </g>

  <!-- Distant port silhouette -->
  <g fill="#020A14" opacity="0.95">
    <rect x="0" y="470" width="1600" height="40"/>
    <!-- cranes -->
    <g stroke="#0A2540" stroke-width="2" fill="none" opacity="0.9">
      <line x1="180" y1="470" x2="180" y2="380"/>
      <line x1="180" y1="380" x2="260" y2="380"/>
      <line x1="180" y1="380" x2="180" y2="345"/>
      <line x1="180" y1="345" x2="245" y2="380"/>

      <line x1="320" y1="470" x2="320" y2="365"/>
      <line x1="320" y1="365" x2="410" y2="365"/>
      <line x1="320" y1="365" x2="320" y2="335"/>
      <line x1="320" y1="335" x2="395" y2="365"/>

      <line x1="1180" y1="470" x2="1180" y2="372"/>
      <line x1="1180" y1="372" x2="1265" y2="372"/>
      <line x1="1180" y1="372" x2="1180" y2="340"/>
      <line x1="1180" y1="340" x2="1255" y2="372"/>

      <line x1="1340" y1="470" x2="1340" y2="358"/>
      <line x1="1340" y1="358" x2="1430" y2="358"/>
      <line x1="1340" y1="358" x2="1340" y2="324"/>
      <line x1="1340" y1="324" x2="1420" y2="358"/>
    </g>

    <!-- container blocks -->
    <rect x="60" y="442" width="80" height="28"/>
    <rect x="430" y="438" width="120" height="32"/>
    <rect x="600" y="446" width="60" height="24"/>
    <rect x="900" y="440" width="140" height="30"/>
    <rect x="1080" y="446" width="60" height="24"/>
    <rect x="1450" y="440" width="100" height="30"/>
  </g>

  <!-- Cargo ship silhouette mid-ground -->
  <g fill="#0A2540" stroke="#C9A961" stroke-width="0.75" opacity="0.95">
    <path d="M 640 540 L 1100 540 L 1080 580 L 660 580 Z"/>
    <rect x="900" y="500" width="60" height="40"/>
    <rect x="965" y="510" width="40" height="30"/>
    <line x1="930" y1="500" x2="930" y2="465" stroke="#C9A961" stroke-width="1"/>
    <line x1="985" y1="510" x2="985" y2="478" stroke="#C9A961" stroke-width="1"/>
    <!-- containers on deck -->
    <g fill="#102E54" stroke="#C9A961" stroke-width="0.4">
      <rect x="680" y="520" width="50" height="18"/>
      <rect x="735" y="520" width="50" height="18"/>
      <rect x="790" y="520" width="50" height="18"/>
      <rect x="845" y="520" width="50" height="18"/>
    </g>
  </g>

  <!-- Water -->
  <rect x="0" y="580" width="1600" height="320" fill="url(#water)"/>

  <!-- Reflective gold streak -->
  <g stroke="#C9A961" opacity="0.35" fill="none" stroke-linecap="round">
    <line x1="860" y1="600" x2="880" y2="600" stroke-width="1"/>
    <line x1="850" y1="630" x2="900" y2="630" stroke-width="1"/>
    <line x1="830" y1="670" x2="920" y2="670" stroke-width="1"/>
    <line x1="800" y1="710" x2="950" y2="710" stroke-width="1"/>
    <line x1="760" y1="755" x2="990" y2="755" stroke-width="1"/>
    <line x1="710" y1="800" x2="1040" y2="800" stroke-width="1"/>
  </g>

  <!-- Wave lines -->
  <g stroke="#C9A961" opacity="0.12" fill="none" stroke-width="0.75">
    <path d="M 0 640 Q 200 630 400 640 T 800 640 T 1200 640 T 1600 640"/>
    <path d="M 0 690 Q 200 680 400 690 T 800 690 T 1200 690 T 1600 690"/>
    <path d="M 0 750 Q 200 740 400 750 T 800 750 T 1200 750 T 1600 750"/>
    <path d="M 0 820 Q 200 810 400 820 T 800 820 T 1200 820 T 1600 820"/>
  </g>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
